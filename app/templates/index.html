{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-blue-900 mb-2">Obtenez une réservation de vol vérifiable</h1>
<p class="text-slate-600 mb-6">Une vraie réservation à votre nom, avec un code PNR vérifiable sur le site de la compagnie, pour votre demande de visa.</p>

<form method="post" action="/search" class="bg-white rounded-xl shadow p-6 grid gap-4 sm:grid-cols-2">
  <label class="block">
    <span class="text-sm font-medium">Départ (code IATA)</span>
    <input name="origin" required maxlength="3" placeholder="TUN" value="{{ form.origin or '' }}"
           class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 uppercase">
  </label>
  <label class="block">
    <span class="text-sm font-medium">Arrivée (code IATA)</span>
    <input name="destination" required maxlength="3" placeholder="CDG" value="{{ form.destination or '' }}"
           class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 uppercase">
  </label>
  <label class="block">
    <span class="text-sm font-medium">Date d'aller</span>
    <input type="date" name="departure_date" required min="{{ today }}" value="{{ form.departure_date or '' }}"
           class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
  </label>
  <label class="block">
    <span class="text-sm font-medium">Date de retour <span class="text-slate-400">(facultatif)</span></span>
    <input type="date" name="return_date" min="{{ today }}" value="{{ form.return_date or '' }}"
           class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
  </label>
  <button class="sm:col-span-2 rounded-lg bg-blue-900 text-white font-semibold py-3 hover:bg-blue-800">
    Rechercher des vols
  </button>
</form>
{% endblock %}
